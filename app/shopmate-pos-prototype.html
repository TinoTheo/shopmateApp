<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopMate — POS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --trade-green:#005B52;
  --trade-deep:#00423B;
  --trade-tint:#E4EEEC;
  --neon:#99FFAA;
  --ink:#0B1A18;
  --slate:#5B6C69;
  --paper:#F3F6F5;
  --card:#FFFFFF;
  --line:#E1E7E5;
  --amber:#9A5200;
  --amber-tint:#FAEFE2;
  --rail:92px;
  --cart:352px;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.35; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--trade-green);outline-offset:2px;border-radius:4px}
.rail :focus-visible{outline-color:var(--neon)}

/* ─── shell ─────────────────────────────── */
.app{display:flex;height:100%;width:100%}

/* ─── zone 1 · navigation rail ──────────── */
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--trade-green);color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:2px;z-index:20;
}
.mark{
  width:38px;height:38px;border-radius:11px;
  border:1.5px solid rgba(255,255,255,.35);
  display:grid;place-items:center;margin-bottom:14px;
  font-weight:600;font-size:15px;letter-spacing:-.02em;
}
.nav-item{
  width:64px;padding:9px 0 7px;border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  color:rgba(255,255,255,.62);transition:background .16s,color .16s;
}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item span{font-size:10.5px;font-weight:500;letter-spacing:.01em}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.on{color:#fff;background:rgba(255,255,255,.16)}

/* ─── signature · the queue ledger ──────── */
.ledger{margin-top:auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:7px}
.ledger-label{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.ticks{
  display:flex;flex-direction:column-reverse;gap:3px;
  width:34px;min-height:74px;justify-content:flex-start;
  padding:6px 5px;border-radius:9px;
  background:rgba(0,0,0,.18);
}
.tick{
  height:5px;border-radius:2px;background:rgba(255,255,255,.5);
  animation:push .22s cubic-bezier(.2,.9,.3,1.4);
}
.tick.sending{background:var(--neon);box-shadow:0 0 10px rgba(153,255,170,.6)}
@keyframes push{from{opacity:0;transform:translateY(7px) scaleX(.4)}to{opacity:1;transform:none}}
.ticks.clear{border:1px dashed rgba(255,255,255,.22);background:transparent}
.ledger-count{font-size:11px;font-weight:600;color:rgba(255,255,255,.85)}
.who{
  margin-top:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.16);display:grid;place-items:center;
  font-size:12px;font-weight:600;
}

/* ─── zone 2 · catalog ──────────────────── */
.catalog{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);
}
.store{min-width:0}
.store b{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store small{font-size:12px;color:var(--slate)}
.search{
  flex:1;max-width:340px;margin-left:auto;position:relative;
}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
}
.search input::placeholder{color:#9AA8A5}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--slate);fill:none;stroke-width:1.9}
.net{
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:500;white-space:nowrap;
}
.net .dot{width:7px;height:7px;border-radius:50%;background:var(--trade-green)}
.net.off{background:var(--amber-tint);border-color:#EFD9BF;color:var(--amber)}
.net.off .dot{background:var(--amber)}

.chips{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:500;white-space:nowrap;color:var(--slate);
}
.chip.on{background:var(--trade-green);border-color:var(--trade-green);color:#fff}

.grid{
  flex:1;overflow-y:auto;padding:4px 20px 22px;
  display:grid;gap:12px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px;text-align:left;display:flex;flex-direction:column;gap:9px;
  transition:transform .12s,border-color .12s,box-shadow .12s;
}
.tile:hover{border-color:#C6D3D0;box-shadow:0 2px 10px rgba(11,26,24,.05)}
.tile:active{transform:scale(.975)}
.glyph{
  width:36px;height:36px;border-radius:10px;background:var(--trade-tint);
  color:var(--trade-green);display:grid;place-items:center;
  font-size:13px;font-weight:600;letter-spacing:-.02em;
}
.tile-name{font-size:13.5px;font-weight:500;line-height:1.25;min-height:2.5em}
.tile-foot{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto}
.price{font-size:15px;font-weight:600;letter-spacing:-.02em}
.stock{font-size:11.5px;color:var(--slate);font-weight:500}
.stock.low{color:var(--amber);background:var(--amber-tint);padding:2px 6px;border-radius:5px}
.stock.flash{animation:bump .5s ease}
@keyframes bump{0%{background:var(--trade-tint);color:var(--trade-green)}100%{}}

/* ─── zone 3 · cart ─────────────────────── */
.cart{
  width:var(--cart);flex:0 0 var(--cart);
  background:var(--card);border-left:1px solid var(--line);
  display:flex;flex-direction:column;
}
.cart-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;
}
.cart-head b{font-size:14px;font-weight:600}
.cart-head small{display:block;font-size:12px;color:var(--slate);margin-top:2px}
.clear{font-size:12.5px;font-weight:500;color:var(--slate);padding:5px 8px;border-radius:7px}
.clear:hover{background:var(--paper);color:var(--ink)}
.lines{flex:1;overflow-y:auto;padding:0 18px}
.line{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line-main{flex:1;min-width:0}
.line-main b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-main small{font-size:11.5px;color:var(--slate)}
.qty{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:9px;padding:2px}
.qty button{width:26px;height:26px;border-radius:7px;font-size:16px;font-weight:500;color:var(--slate);display:grid;place-items:center;line-height:1}
.qty button:hover{background:#fff;color:var(--ink)}
.qty b{min-width:20px;text-align:center;font-size:13px;font-weight:600}
.line-total{width:58px;text-align:right;font-size:13.5px;font-weight:600}
.empty{padding:36px 6px;text-align:center;color:var(--slate);font-size:13.5px;line-height:1.5}
.empty svg{width:26px;height:26px;stroke:#B9C6C3;fill:none;stroke-width:1.5;margin-bottom:10px}

.cart-foot{border-top:1px solid var(--line);padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.pays{display:flex;gap:6px}
.pay{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--slate)}
.pay.on{border-color:var(--trade-green);color:var(--trade-green);background:var(--trade-tint);font-weight:600}
.sums{display:flex;flex-direction:column;gap:5px}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--slate)}
.sum.total{color:var(--ink);font-size:19px;font-weight:600;letter-spacing:-.025em;padding-top:5px}
.charge{
  background:var(--neon);color:var(--ink);
  padding:15px;border-radius:var(--r-md);
  font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  display:flex;justify-content:center;gap:8px;
  transition:transform .12s,filter .12s;
}
.charge:hover{filter:brightness(1.04)}
.charge:active{transform:scale(.985)}
.charge[disabled]{background:var(--paper);color:#A6B3B0;cursor:not-allowed}

/* ─── toast ─────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,110%);
  background:var(--ink);color:#fff;border-radius:var(--r-md);
  padding:12px 16px 12px 13px;display:flex;align-items:center;gap:11px;
  box-shadow:0 10px 32px rgba(11,26,24,.28);z-index:60;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px);
}
.toast.up{transform:translate(-50%,0)}
.toast .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--neon)}
.toast b{font-size:13.5px;font-weight:600;display:block}
.toast small{font-size:12px;color:#A9BCB8}

/* ─── phone layout ──────────────────────── */
.m-ledger{display:none}
@media (max-width:899px){
  :root{--rail:0px}
  .app{flex-direction:column}
  .rail{
    order:3;width:100%;flex:0 0 auto;flex-direction:row;
    justify-content:space-around;align-items:center;padding:6px 4px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  .mark,.ledger,.who{display:none}
  .nav-item{width:auto;flex:1;padding:7px 0 5px}
  .catalog{order:1;flex:1;min-height:0}
  .topbar{flex-wrap:wrap;padding:12px 16px;gap:10px}
  .store{flex:1}
  .search{max-width:none;order:3;flex-basis:100%;margin-left:0}
  .chips{padding:10px 16px}
  .grid{padding:2px 16px 96px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .m-ledger{
    display:flex;order:2;align-items:center;gap:8px;
    padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);
    font-size:12px;color:var(--slate);
  }
  .m-ledger .ticks{flex-direction:row;min-height:0;width:auto;padding:5px 6px;gap:3px;background:var(--paper)}
  .m-ledger .tick{height:12px;width:4px;background:var(--trade-green);opacity:.55}
  .m-ledger .tick.sending{opacity:1;background:var(--trade-green);box-shadow:0 0 8px rgba(0,91,82,.5)}
  .cart{
    order:2;position:fixed;left:0;right:0;bottom:0;z-index:40;
    width:100%;height:76vh;border-left:0;border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;box-shadow:0 -8px 34px rgba(11,26,24,.14);
    transform:translateY(calc(100% - 132px));
    transition:transform .28s cubic-bezier(.2,.8,.3,1);
    padding-bottom:calc(58px + env(safe-area-inset-bottom));
  }
  .cart.open{transform:translateY(0)}
  .cart-head{cursor:pointer;padding-top:14px}
  .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:2px;background:var(--line)}
  .cart-foot{border-top:1px solid var(--line)}
  .toast{bottom:auto;top:14px;transform:translate(-50%,-160%)}
  .toast.up{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="app">

  <!-- zone 1 -->
  <nav class="rail">
    <div class="mark">SM</div>
    <button class="nav-item on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 15h5"/></svg><span>Sell</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg><span>Products</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18" cy="18" r="3"/></svg><span>Stock</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Reports</span></button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-13.7-5.7L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.7L20 16"/><path d="M20 20v-4h-4"/></svg><span>Sync</span></button>

    <div class="ledger">
      <div class="ledger-label">Queue</div>
      <div class="ticks clear" id="ticks"></div>
      <div class="ledger-count num" id="qcount">0</div>
    </div>
    <div class="who">TM</div>
  </nav>

  <!-- zone 2 -->
  <main class="catalog">
    <header class="topbar">
      <div class="store">
        <b>Msasa Mini Mart</b>
        <small>Till 2 · Tino M.</small>
      </div>
      <button class="net" id="net" aria-label="Network status — tap to switch">
        <span class="dot"></span><span id="net-label">Online · all synced</span>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search or scan barcode" aria-label="Search products">
      </div>
    </header>

    <div class="m-ledger">
      <div class="ticks clear" id="ticks-m"></div>
      <span id="mledger-label">All sales synced</span>
    </div>

    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- zone 3 -->
  <aside class="cart" id="cart">
    <div class="grab"></div>
    <div class="cart-head" id="cart-head">
      <div><b id="sale-no">Sale #0142</b><small id="cart-sub">No items yet</small></div>
      <button class="clear" id="clear">Clear</button>
    </div>
    <div class="lines" id="lines"></div>
    <div class="cart-foot">
      <div class="pays" id="pays">
        <button class="pay on" data-pay="Cash">Cash</button>
        <button class="pay" data-pay="EcoCash">EcoCash</button>
        <button class="pay" data-pay="Card">Card</button>
      </div>
      <div class="sums">
        <div class="sum"><span>Subtotal</span><span class="num" id="subtotal">$0.00</span></div>
        <div class="sum"><span>VAT 15%</span><span class="num" id="vat">$0.00</span></div>
        <div class="sum total"><span>Total</span><span class="num" id="total">$0.00</span></div>
      </div>
      <button class="charge" id="charge" disabled>Charge</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="bar"></div>
  <div><b id="toast-title">Charged</b><small id="toast-sub"></small></div>
</div>

<script>
const P = [
  {id:1,  n:"Mazoe Orange Crush 2L",     c:"Drinks",    p:4.50, s:24},
  {id:2,  n:"Coca-Cola 500ml",           c:"Drinks",    p:0.90, s:60},
  {id:3,  n:"Cascade Juice 1L",          c:"Drinks",    p:2.20, s:18},
  {id:4,  n:"Tanganda Tea 100s",         c:"Drinks",    p:3.80, s:9},
  {id:5,  n:"Freshpak Rooibos 80s",      c:"Drinks",    p:4.20, s:6},
  {id:6,  n:"Lobels Bread 800g",         c:"Bakery",    p:1.10, s:32},
  {id:7,  n:"Bakers Inn Rolls 6s",       c:"Bakery",    p:1.50, s:12},
  {id:8,  n:"Scones 4s",                 c:"Bakery",    p:1.80, s:5},
  {id:9,  n:"Gloria Flour 2kg",          c:"Grocery",   p:2.90, s:16},
  {id:10, n:"Cooking Oil 2L",            c:"Grocery",   p:4.30, s:11},
  {id:11, n:"Steri Milk 500ml",          c:"Grocery",   p:1.05, s:28},
  {id:12, n:"Red Seal Sugar 2kg",        c:"Grocery",   p:2.60, s:14},
  {id:13, n:"Rice 2kg",                  c:"Grocery",   p:3.40, s:7},
  {id:14, n:"Sunlight Soap 500g",        c:"Household", p:1.40, s:22},
  {id:15, n:"Jik Bleach 750ml",          c:"Household", p:1.95, s:13},
  {id:16, n:"Vim Scourer 500g",          c:"Household", p:1.60, s:4},
  {id:17, n:"Willards Things 150g",      c:"Snacks",    p:1.25, s:30},
  {id:18, n:"Charhons Biscuits 200g",    c:"Snacks",    p:0.80, s:26},
  {id:19, n:"Cerevita 500g",             c:"Snacks",    p:5.10, s:8}
];
const CATS = ["All","Drinks","Bakery","Grocery","Household","Snacks"];

let cart = {}, cat = "All", term = "", online = true, queue = [], saleNo = 142, pay = "Cash", draining = null;

const $  = s => document.querySelector(s);
const money = v => "$" + v.toFixed(2);
const initials = n => n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ── catalog ───────────────────────────── */
function drawChips(){
  $("#chips").innerHTML = CATS.map(c =>
    `<button class="chip${c===cat?" on":""}" data-cat="${c}">${c}</button>`).join("");
}
function drawGrid(){
  const list = P.filter(x =>
    (cat==="All" || x.c===cat) &&
    (!term || x.n.toLowerCase().includes(term)));
  $("#grid").innerHTML = list.length ? list.map(x => `
    <button class="tile" data-id="${x.id}" ${x.s<=0?"disabled":""}>
      <div class="glyph">${initials(x.n)}</div>
      <div class="tile-name">${x.n}</div>
      <div class="tile-foot">
        <span class="price num">${money(x.p)}</span>
        <span class="stock num${x.s<=6?" low":""}" id="stock-${x.id}">${x.s<=6?"Low · ":""}${x.s}</span>
      </div>
    </button>`).join("")
    : `<div class="empty" style="grid-column:1/-1">Nothing matches “${term}”.<br>Try another name, or add it under Products.</div>`;
}

/* ── cart ──────────────────────────────── */
function totals(){
  const sub = Object.entries(cart).reduce((t,[id,q]) => t + P.find(x=>x.id==id).p*q, 0);
  return {sub, vat: sub*0.15, tot: sub*1.15, count: Object.values(cart).reduce((a,b)=>a+b,0)};
}
function drawCart(){
  const ids = Object.keys(cart), t = totals();
  $("#lines").innerHTML = ids.length ? ids.map(id => {
    const x = P.find(p=>p.id==id), q = cart[id];
    return `<div class="line">
      <div class="line-main"><b>${x.n}</b><small class="num">${money(x.p)} each</small></div>
      <div class="qty">
        <button data-step="-1" data-id="${id}" aria-label="One less ${x.n}">−</button>
        <b class="num">${q}</b>
        <button data-step="1" data-id="${id}" aria-label="One more ${x.n}">+</button>
      </div>
      <div class="line-total num">${money(x.p*q)}</div>
    </div>`; }).join("")
    : `<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 5h2l2.5 11h10L20 8H6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><br>No items yet.<br>Tap a product to start the sale.</div>`;
  $("#sale-no").textContent = "Sale #0" + saleNo;
  $("#cart-sub").textContent = t.count ? `${t.count} item${t.count>1?"s":""} · ${pay}` : "No items yet";
  $("#subtotal").textContent = money(t.sub);
  $("#vat").textContent = money(t.vat);
  $("#total").textContent = money(t.tot);
  const btn = $("#charge");
  btn.disabled = !t.count;
  btn.textContent = t.count ? `Charge ${money(t.tot)}` : "Charge";
}

/* ── the queue ledger (signature) ──────── */
function drawQueue(){
  const html = queue.map(q => `<div class="tick${q.sending?" sending":""}"></div>`).join("");
  ["#ticks","#ticks-m"].forEach(sel => {
    const el = $(sel);
    el.innerHTML = html;
    el.classList.toggle("clear", queue.length===0);
  });
  $("#qcount").textContent = queue.length;
  $("#mledger-label").textContent = queue.length
    ? `${queue.length} sale${queue.length>1?"s":""} held on this device`
    : "All sales synced";
  $("#net-label").textContent = online
    ? "Online · all synced"
    : `Offline · ${queue.length} held`;
  $("#net").classList.toggle("off", !online);
}
function drain(){
  clearInterval(draining);
  draining = setInterval(() => {
    if(!online || !queue.length){ clearInterval(draining); drawQueue(); return; }
    queue[0].sending = true; drawQueue();
    setTimeout(() => { queue.shift(); drawQueue(); }, 200);
  }, 340);
}

/* ── actions ───────────────────────────── */
function add(id){
  const x = P.find(p=>p.id==id);
  if(x.s - (cart[id]||0) <= 0) return toast("Out of stock", `${x.n} — count it in under Stock.`);
  cart[id] = (cart[id]||0) + 1;
  drawCart();
  if(window.innerWidth < 900) $("#cart").classList.remove("open");
}
function charge(){
  const t = totals();
  Object.entries(cart).forEach(([id,q]) => {
    const x = P.find(p=>p.id==id); x.s -= q;
    const el = $("#stock-"+id);
    if(el){ el.className = "stock num" + (x.s<=6?" low":"") + " flash"; el.textContent = (x.s<=6?"Low · ":"") + x.s; }
  });
  queue.push({no:saleNo, sending:false});
  toast(`Charged ${money(t.tot)}`, online ? `Sale #0${saleNo} · ${pay} · syncing now` : `Sale #0${saleNo} · ${pay} · held until you're back`);
  saleNo++; cart = {};
  drawCart(); drawQueue(); drawGrid();
  if(online) drain();
}
function toast(title, sub){
  $("#toast-title").textContent = title;
  $("#toast-sub").textContent = sub;
  const el = $("#toast"); el.classList.add("up");
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("up"), 2600);
}

/* ── wiring ────────────────────────────── */
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if(!b) return;
  cat = b.dataset.cat; drawChips(); drawGrid();
});
$("#grid").addEventListener("click", e => {
  const b = e.target.closest("[data-id]"); if(b) add(b.dataset.id);
});
$("#lines").addEventListener("click", e => {
  const b = e.target.closest("[data-step]"); if(!b) return;
  const id = b.dataset.id, next = (cart[id]||0) + (+b.dataset.step);
  if(next <= 0) delete cart[id]; else cart[id] = next;
  drawCart();
});
$("#pays").addEventListener("click", e => {
  const b = e.target.closest("[data-pay]"); if(!b) return;
  pay = b.dataset.pay;
  document.querySelectorAll(".pay").forEach(p => p.classList.toggle("on", p===b));
  drawCart();
});
$("#clear").addEventListener("click", e => { e.stopPropagation(); cart = {}; drawCart(); });
$("#charge").addEventListener("click", charge);
$("#q").addEventListener("input", e => { term = e.target.value.toLowerCase().trim(); drawGrid(); });
$("#net").addEventListener("click", () => {
  online = !online;
  drawQueue();
  if(online){ toast("Back online", queue.length ? `Sending ${queue.length} held sale${queue.length>1?"s":""}` : "Nothing waiting"); drain(); }
  else toast("Working offline", "Sales keep recording on this device.");
});
$("#cart-head").addEventListener("click", () => {
  if(window.innerWidth < 900) $("#cart").classList.toggle("open");
});

drawChips(); drawGrid(); drawCart(); drawQueue();
</script>
</body>
</html>
